# Default values for globaleaks.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  tenant: bcn

  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard

# GlobaLeaks is not clusterable: this chart mounts a single ReadWriteOnce PVC,
# so replicaCount must stay at 1.
replicaCount: 1

image:
  repository: globaleaks/globaleaks
  tag: "v5.0.99"
  pullPolicy: IfNotPresent

securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

service:
  type: NodePort
  port: 8080
  httpsPort: 8443

resources:
  limits:
    cpu: 1000m
    memory: 1000Mi
  requests:
    cpu: 500m
    memory: 524Mi

## The following settings are to configure the frequency of the 
livenessProbe:
    enabled: true
    path: /#
    scheme: HTTPS
    port: 8443
    initialDelaySeconds: 30
    failureThreshold: 10
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1

readinessProbe:
    enabled: true
    path: /#
    scheme: HTTPS
    port: 8443
    initialDelaySeconds: 30
    failureThreshold: 10
    successThreshold: 1
    timeoutSeconds: 5
    periodSeconds: 10

startupProbe:
    enabled: true
    path: /#
    scheme: HTTPS
    port: 8443
    initialDelaySeconds: 30
    failureThreshold: 60
    periodSeconds: 5
    timeoutSeconds: 5

ingress:
  enabled: true
  # Hostname used for the ingress rule and TLS cert. Defaults to "<release-name>.example.com" when unset.
  host: ""
  tlsSecretName: globaleaks-tls

# Gateway API alternative to the Ingress above (e.g. Envoy Gateway). Disabled by default;
# the Gateway/GatewayClass are expected to already exist in the cluster.
httpRoute:
  enabled: false
  # Defaults to ingress.host, then "<release-name>.example.com".
  host: ""
  # Required when enabled, e.g.:
  # parentRefs:
  # - name: eg
  #   namespace: envoy-gateway-system
  #   sectionName: https
  parentRefs: []
  redirect:
    # Extra HTTPRoute redirecting HTTP -> HTTPS; parentRefs must point to the Gateway's HTTP listener.
    enabled: false
    parentRefs: []
  backendTLS:
    # GlobaLeaks listens on HTTPS: enable to make the gateway use TLS towards the backend.
    enabled: true
    # SNI/hostname to validate; defaults to the route host.
    hostname: ""
    # e.g. [{group: "", kind: ConfigMap, name: globaleaks-ca}]; falls back to the system CA bundle when empty.
    caCertificateRefs: []
