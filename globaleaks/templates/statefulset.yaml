{{- if gt (.Values.replicaCount | int) 1 }}
{{- fail "replicaCount > 1 is not supported: GlobaLeaks does not support multiple instances sharing the single ReadWriteOnce PVC created by this chart" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-globaleaks
  labels:
    {{- include "globaleaks.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-globaleaks
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-globaleaks
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-globaleaks
        {{- include "globaleaks.labels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Release.Name }}-globaleaks
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
        # Remove only the stale pidfile (left behind if the container is killed and
        # restarted in the same pod), keeping the rest of /run/globaleaks, then exec
        # so globaleaks is PID 1 and receives SIGTERM.
        command: ["/bin/sh", "-c",
          "rm -f /run/globaleaks/globaleaks.pid; exec /usr/bin/python3 /usr/bin/globaleaks --working-path=/var/globaleaks/ -n"]
        env:
        - name: TENANT
          value: "{{ .Values.global.tenant }}"
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        volumeMounts:
          - name: data
            mountPath: /var/globaleaks/
          - name: run
            mountPath: /run/globaleaks
          - name: tmp
            mountPath: /tmp
        {{- if .Values.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: {{ .Values.startupProbe.path }}
            scheme: {{ .Values.startupProbe.scheme | upper }}
            port: {{ .Values.startupProbe.port }}
          initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            scheme: {{ .Values.readinessProbe.scheme | upper }}
            port: {{ .Values.readinessProbe.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            scheme: {{ .Values.livenessProbe.scheme | upper }}
            port: {{ .Values.livenessProbe.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc
        # In-memory: /run/globaleaks holds the ramdisk with token markers that must never reach disk.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir: {}
