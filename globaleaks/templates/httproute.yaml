{{- if .Values.httpRoute.enabled }}
{{- $host := .Values.httpRoute.host | default .Values.ingress.host | default (printf "%s.example.com" .Release.Name) }}
{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required: reference the Gateway (and listener) this route attaches to" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-globaleaks
  labels:
    {{- include "globaleaks.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
  - {{ $host }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ .Release.Name }}-globaleaks
      port: {{ .Values.service.httpsPort }}
{{- if .Values.httpRoute.redirect.enabled }}
---
# Redirects plain HTTP to HTTPS. Attach it to the Gateway's HTTP listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-globaleaks-redirect
  labels:
    {{- include "globaleaks.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.redirect.parentRefs | nindent 4 }}
  hostnames:
  - {{ $host }}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
{{- if .Values.httpRoute.backendTLS.enabled }}
---
# GlobaLeaks serves HTTPS on its own port: the gateway must speak TLS to the backend.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Release.Name }}-globaleaks
  labels:
    {{- include "globaleaks.labels" . | nindent 4 }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: {{ .Release.Name }}-globaleaks
    sectionName: https
  validation:
    hostname: {{ .Values.httpRoute.backendTLS.hostname | default $host }}
    {{- if .Values.httpRoute.backendTLS.caCertificateRefs }}
    caCertificateRefs:
      {{- toYaml .Values.httpRoute.backendTLS.caCertificateRefs | nindent 6 }}
    {{- else }}
    wellKnownCACertificates: System
    {{- end }}
{{- end }}
{{- end }}
