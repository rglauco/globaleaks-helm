apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    extraPortMappings:
      # Non-standard host ports to avoid clashing with other services already
      # bound to 80/443 on the host (browser workflow: http(s)://<host>:1844x/).
      - containerPort: 80
        hostPort: 18080
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        protocol: TCP