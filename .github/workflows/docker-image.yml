name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    # Disabled: the chart uses the official globaleaks/globaleaks image.
    if: false
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build . --file docker-deprecated/Dockerfile --tag globaleaks:$(date +%s)

  helm-chart:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: azure/setup-helm@v4
    - name: Lint Helm chart
      run: helm lint globaleaks/
    - name: Render Helm chart
      run: helm template test globaleaks/
